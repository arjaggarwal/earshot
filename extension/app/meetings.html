<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earshot</title>
    <link rel="stylesheet" href="meetings.css" />
  </head>
  <body>
    <aside>
      <div class="brand"><button id="listToggle" class="ghost fold" title="Hide the meeting list ([)" aria-label="Hide or show the meeting list"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><span class="logo">E</span><span class="name">Earshot</span> <button id="settingsBtn" class="ghost" title="Settings">Settings</button></div>
      <input id="filter" type="search" placeholder="Search meetings, people, what was said" title="Press / to search" />
      <div class="viewswitch" role="tablist">
        <button data-view="day" role="tab">By day</button>
        <button data-view="company" role="tab">By company</button>
      </div>
      <div id="tagFilter" class="tagfilter"></div>
      <div id="list"><div class="empty">Loading meetings…</div></div>
      <div id="helperState" class="helperstate"></div>
    </aside>
    <main id="detail">
      <div class="empty">Loading…</div>
    </main>
    <div class="lightbox"><img alt="" /></div>
    <div class="toast" role="status"></div>
    <script src="../shared/transcript.js"></script>
    <script src="../shared/markdown.js"></script>
    <script src="../shared/languages.js"></script>
    <script src="meetings.js"></script>
  </body>
</html>
